[workspace]

[package]
name = "magnetar-component-nemotron"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "NVIDIA Nemotron model Component for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-component-Nemotron"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science", "wasm"]
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"
